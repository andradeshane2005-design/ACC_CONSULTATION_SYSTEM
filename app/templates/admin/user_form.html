{% extends "base.html" %}
{% block title %}{{ 'Edit' if user else 'Create' }} User{% endblock %}
{% block content %}
<div class="page-head"><div><span class="eyebrow">USER ACCOUNT</span><h1>{{ 'Edit user' if user else 'Create user' }}</h1><p>Assign a role and manage account access.</p></div></div>
<form method="post" class="card form-grid">
    <label>First name<input name="first_name" required value="{{ user.first_name if user else '' }}"></label>
    <label>Last name<input name="last_name" required value="{{ user.last_name if user else '' }}"></label>
    <label>Email<input type="email" name="email" required value="{{ user.email if user else '' }}"></label>
    <label>Student ID<input name="student_id" value="{{ user.student_id if user else '' }}"></label>
    <label>Phone<input name="phone" value="{{ user.phone if user else '' }}"></label>
    <label>Program<input name="program" value="{{ user.program if user else '' }}"></label>
    <label>Year level<input name="year_level" value="{{ user.year_level if user else '' }}"></label>
    <label>Role<select name="role_id" required>{% for role in roles %}<option value="{{ role.id }}" {% if user and role in user.roles %}selected{% endif %}>{{ role.name }}</option>{% endfor %}</select></label>
    <label class="full-span">Password <small>{{ '(leave blank to keep current password)' if user else '' }}</small><input type="password" name="password" {{ '' if user else 'required' }}></label>
    {% if user %}
    <label class="checkbox full-span"><input type="checkbox" name="is_active" value="1" {% if user.is_active %}checked{% endif %}> Account is active</label>
    {% endif %}
    <div class="full-span form-actions"><a class="btn" href="{{ url_for('admin.users') }}">Cancel</a><button class="btn btn-primary">Save User</button></div>
</form>
{% endblock %}
